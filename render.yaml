services:
  - type: web
    name: industry-intelligence
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 26.13.0
      - key: HOST
        value: 0.0.0.0
      - key: APP_PASSWORD
        sync: false
